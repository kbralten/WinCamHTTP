# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'  # Trigger on version tags for releases
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: WinCamHTTP.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages (native projects)
      working-directory: ${{ github.workspace }}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}


    - name: Build (native solution)
      working-directory: ${{ github.workspace }}
      # Build x64 to match the installer inputs
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}
    
    - name: Build Installer (Inno Setup)
      working-directory: ${{ github.workspace }}
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
        & $iscc "/DConfiguration=${{env.BUILD_CONFIGURATION}}" "/DPlatform=x64" "Installer\WinCamHTTP.iss"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinCamHTTP-${{env.BUILD_CONFIGURATION}}
        path: ${{ github.workspace }}/Installer/Output/WinCamHTTPSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download Installer Artifact
      uses: actions/download-artifact@v4
      with:
        name: WinCamHTTP-${{env.BUILD_CONFIGURATION}}
        path: ./artifacts

    - name: Get version from tag
      id: get_version
      run: |
        TAG="${{ github.ref_name }}"
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/WinCamHTTPSetup.exe
        name: Release ${{ steps.get_version.outputs.tag }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}